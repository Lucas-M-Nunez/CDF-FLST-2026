<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>

    <form class="formulario-contacto" action="">
      <div>
        <label for="name">Nombre</label>
        <input type="text" name="name" id="name" />
      </div>

      <div>
        <label for="apellido">Apellido</label>
        <input type="text" name="apellido" id="apellido" />
      </div>
      <div>
        <label for="email">Email</label>
        <input type="email" name="email" id="email" />
      </div>

      <div>
        <label for="ciudad">Seleccione su Ciudad:</label>
        <input type="radio" name="ciudad" value="Mendoza" id="ciudad" /> Mendoza
        <input type="radio" name="ciudad" value="Buenos Aires" id="ciudad" /> Buenos Aires
      </div>

      <div>
        <label for="password">Contraseña</label>
        <input type="password" name="password" id="password" />
      </div>
      <div>
        <label for="textarea">Deja comentario</label>
        <textarea name="textarea" id="textarea"></textarea>
      </div>
    </form>

    <a href="../index.html " >volver</a>
  </body>
</html>
